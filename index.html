<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.James Art Income Planner</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; width: 380px; max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin-bottom: 5px; color: #111827; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; margin-bottom: 15px; font-size: 15px; }
    button.calc { width: 100%; padding: 12px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button.calc:hover { background: #374151; }
    .results { margin-top: 20px; }
    .result-item { padding: 12px 0; border-bottom: 1px solid #eee; }
    .row { display: flex; justify-content: space-between; font-size: 14px; }
    .label { color: #374151; }
    .value { font-weight: bold; color: #111827; }
    .bank { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .bank img { width: 28px; height: 28px; border-radius: 7px; border: 1px solid #e5e7eb; flex-shrink: 0; }
    .bank-info { flex: 1; min-width: 0; }
    .bank-name { font-size: 12px; color: #6b7280; }
    .acct { font-size: 14px; font-weight: 600; color: #111827; letter-spacing: 0.5px; }
    .copy { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .copy:hover { background: #e5e7eb; }
    .copy.done { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .note { margin-top: 15px; font-size: 13px; color: #6b7280; font-style: italic; }
</style>
</head>

<body>

<div class="card">
    <h1>💰 Income Planner</h1>
    <p class="subtitle">A.James Art Financial System</p>

    <input type="number" id="income" placeholder="Enter income (₦)">

    <div class="results" id="results"></div>
</div>

const ALLOCATIONS = [
    { label: "Tithe", pct: 10, bank: "Kuda", logo: LOGOS.kuda, acct: "2023215267" },
    { label: "Living Expenses", pct: 45, bank: "Opay", logo: LOGOS.opay, acct: "8149800301" },
    { label: "Art/Business", pct: 20, bank: "PalmPay", logo: LOGOS.palmpay, acct: "8149800301" },
    { label: "Savings", pct: 25, bank: "Nombank MFB", logo: LOGOS.nombank, acct: "3625550705" }
];

function calculate() {
    let income = document.getElementById("income").value;

    if (income === "" || income <= 0) {
        alert("Enter a valid income");
        return;
    }

    income = parseFloat(income);

    const html = ALLOCATIONS.map(a => `
        <div class="result-item">
            <div class="row">
                <span class="label">${a.label} (${a.pct}%)</span>
                <span class="value">₦${(income * a.pct / 100).toFixed(2)}</span>
            </div>
            <div class="bank">
                <img src="${a.logo}" alt="${a.bank} logo">
                <div class="bank-info">
                    <div class="bank-name">${a.bank}</div>
                    <div class="acct">${a.acct}</div>
                </div>
                <button class="copy" onclick="copyAcct('${a.acct}', this)">Copy</button>
            </div>
        </div>
    `).join("");

    document.getElementById("results").innerHTML =
        html + '<p class="note">Any charges falls on the living and Expenses</p>';
}

function copyAcct(text, btn) {
    const done = () => {
        btn.textContent = "Copied!";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done);
    } else {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        done();
    }
}
</script>
