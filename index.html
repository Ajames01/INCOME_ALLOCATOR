<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.James Art Income Planner</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        width: 380px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
        font-size: 20px;
        margin-bottom: 5px;
        color: #111827;
    }

    .subtitle {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        margin-bottom: 15px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #111827;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #374151;
    }

    .results {
        margin-top: 20px;
    }

    .result-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    .label {
        color: #374151;
    }

    .value {
        font-weight: bold;
        color: #111827;
    }
</style>
</head>

<body>

<div class="card">
    <h1>💰 Income Planner</h1>
    <p class="subtitle">A.James Art Financial System</p>

    <input type="number" id="income" placeholder="Enter income (₦)">
    <button onclick="calculate()">Calculate</button>

    <div class="results" id="results"></div>
</div>

<script>
function calculate() {
    let income = document.getElementById("income").value;

    if (income === "" || income <= 0) {
        alert("Enter a valid income");
        return;
    }

    income = parseFloat(income);

    let tithe = income * 0.10;
    let living = income * 0.45;
    let business = income * 0.20;
    let savings = income * 0.25;

    document.getElementById("results").innerHTML = `
        <div class="result-item">
            <span class="label">Tithe (10%)</span>
            <span class="value">₦${tithe.toFixed(2)}</span>
        </div>
        <div class="result-item">
            <span class="label">Living Expenses (45%)</span>
            <span class="value">₦${living.toFixed(2)}</span>
        </div>
        <div class="result-item">
            <span class="label">Art/Business (20%)</span>
            <span class="value">₦${business.toFixed(2)}</span>
        </div>
        <div class="result-item">
            <span class="label">Savings (25%)</span>
            <span class="value">₦${savings.toFixed(2)}</span>
        </div>
    `;
}
</script>

</body>
</html>
